version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    ignore:
      # TypeScript 7 (native compiler) drops the JS API that SvelteKit and svelte-check rely on.
      # Remove once both support it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      svelte:
        patterns:
          - 'svelte*'
          - '@sveltejs/*'
      typescript:
        patterns:
          - 'typescript*'
          - '@typescript-eslint/*'
      build-tools:
        patterns:
          - 'vite*'
          - '@sveltejs/adapter-*'
          - 'prettier'
          - 'eslint*'
      dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - 'svelte*'
          - '@sveltejs/*'
          - 'typescript*'
          - '@typescript-eslint/*'
          - 'vite*'
          - 'prettier'
          - 'eslint*'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
